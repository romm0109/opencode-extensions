name: OpenCode extensions

on:
  pull_request:
    paths:
      - "opencode/extensions/**"
      - ".github/workflows/opencode-extensions.yml"
  push:
    branches: [main, opencode-v2-workflow-port]
    paths:
      - "opencode/extensions/**"
      - ".github/workflows/opencode-extensions.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opencode/extensions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: opencode/extensions/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm pack --dry-run
